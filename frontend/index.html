<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%app-mark.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%app-mark.svg" />
    <title>EraEdu — Modern Learning Platform</title>
    <script type="text/javascript">
      (function (location) {
        if (location.search[1] === '/') {
          var decoded = location.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null, location.pathname.replace(/\/$/, '') + decoded + location.hash);
        }
      }(window.location));
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
